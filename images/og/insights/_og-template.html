<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>OG Template</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1200px;height:630px;overflow:hidden}
  body{
    position:relative;
    background:#0b0b0b;
    font-family:'Pretendard Variable',Pretendard,sans-serif;
    color:#fff;
  }
  /* v3 (2026-07-09): 그라데이션/pill 제거, 실제 로고 이미지, 세리프 제목, 컨테이너 가이드선 */
  .guides::before,.guides::after{
    content:"";position:absolute;top:0;bottom:0;width:1px;background:rgba(255,255,255,.10);
  }
  .guides::before{left:56px}
  .guides::after{right:56px}
  .frame{position:absolute;inset:0;padding:64px 96px;display:flex;flex-direction:column}
  .top{display:flex;justify-content:space-between;align-items:center}
  .brand{display:flex;align-items:center;gap:16px}
  .brand img.mark{height:44px;width:auto}
  .brand img.wordmark{height:30px;width:auto}
  .category{font-family:'SF Mono','Cascadia Mono',ui-monospace,monospace;font-weight:600;font-size:20px;letter-spacing:.24em;color:#2dd4bf;text-transform:uppercase}
  .mid{flex:1;display:flex;flex-direction:column;justify-content:center;padding-bottom:16px}
  .title{font-family:'Noto Serif KR',serif;font-weight:700;font-size:72px;line-height:1.26;letter-spacing:-.01em;word-break:keep-all;white-space:pre-line}
  .subtitle{margin-top:28px;font-weight:500;font-size:29px;line-height:1.5;color:#b9bdc4;word-break:keep-all}
  .bottom{display:flex;justify-content:space-between;align-items:center}
  .url{font-family:'SF Mono','Cascadia Mono',ui-monospace,monospace;font-weight:600;font-size:22px;color:#8a8f96;letter-spacing:.04em}
  .tag{
    font-family:'SF Mono','Cascadia Mono',ui-monospace,monospace;font-weight:600;font-size:20px;color:#e8e8e5;
    padding:12px 24px;border:1px solid rgba(255,255,255,.28);border-radius:6px;letter-spacing:.1em;
  }
</style>
</head>
<body>
  <div class="guides"></div>
  <div class="frame">
    <div class="top">
      <div class="brand">
        <img class="mark" src="../../logo/ap-mark.png" alt="">
        <img class="wordmark" src="../../logo/ap-wordmark-web.png" alt="Ahn Partners">
      </div>
      <div class="category" id="cat">INSIGHT</div>
    </div>
    <div class="mid">
      <div class="title" id="title">제목</div>
      <div class="subtitle" id="sub">부제</div>
    </div>
    <div class="bottom">
      <div class="url">ahn-partners.net/insights</div>
      <div class="tag" id="tag">INSIGHT</div>
    </div>
  </div>
<script>
  const p = new URLSearchParams(location.search);
  document.getElementById('cat').textContent = p.get('c') || 'INSIGHT';
  document.getElementById('title').textContent = (p.get('t') || '').replace(/\|/g, '\n');
  document.getElementById('sub').textContent = p.get('s') || '';
  document.getElementById('tag').textContent = p.get('g') || 'FULL INSIGHT';
</script>
</body>
</html>
