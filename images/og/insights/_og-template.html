<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Ahn Partners Insight Visual</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1200px;height:630px;overflow:hidden}
  body{--bg:#101211;--fg:#f4f4f0;--muted:#a7aaa6;--line:rgba(255,255,255,.14);--panel:rgba(255,255,255,.055);--accent:#2dd4bf;position:relative;background:var(--bg);color:var(--fg);font-family:'Pretendard Variable',Pretendard,sans-serif}
  body.theme-light{--bg:#f4f1e9;--fg:#151817;--muted:#656a66;--line:rgba(21,24,23,.16);--panel:rgba(255,255,255,.58)}
  body.theme-deep{--bg:#0b292b;--fg:#f6f5ef;--muted:#b4c5c2;--line:rgba(255,255,255,.15);--panel:rgba(255,255,255,.055)}
  body.accent-amber{--accent:#f5a623}
  .guides::before,.guides::after{content:"";position:absolute;top:0;bottom:0;width:1px;background:var(--line)}
  .guides::before{left:56px}.guides::after{right:56px}
  .frame{position:absolute;inset:0;padding:52px 76px 44px;display:flex;flex-direction:column}
  .top{height:48px;display:flex;align-items:center;justify-content:space-between}
  .brand{display:flex;align-items:center;gap:14px}.mark{width:38px;height:38px;object-fit:contain}.wordmark{width:182px;height:auto}
  .category{font-family:'SF Mono','Cascadia Mono',ui-monospace,monospace;font-size:18px;font-weight:700;letter-spacing:.16em;color:var(--accent)}
  .content{flex:1;display:grid;grid-template-columns:minmax(0,1.08fr) minmax(0,.92fr);gap:54px;align-items:center;padding:32px 0 24px}
  .composition-reverse .copy{order:2}.composition-reverse .visual{order:1}
  .composition-vertical .content{grid-template-columns:1fr;grid-template-rows:auto 190px;gap:24px;padding-top:26px}.composition-vertical .copy{max-width:1020px}.composition-vertical .title{font-size:48px;max-width:980px}.composition-vertical .thesis{margin-top:14px}.composition-vertical .visual{height:190px}
  .title{font-family:'Noto Serif KR',serif;font-size:52px;line-height:1.17;letter-spacing:-.025em;font-weight:700;word-break:keep-all}
  .thesis{margin-top:22px;max-width:570px;font-size:23px;line-height:1.45;color:var(--muted);font-weight:520;word-break:keep-all}
  .visual{min-height:330px;border:1px solid var(--line);background:var(--panel);padding:28px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
  .visual::before{content:attr(data-layout);position:absolute;top:16px;left:18px;font-family:'SF Mono','Cascadia Mono',ui-monospace,monospace;font-size:11px;font-weight:700;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
  .bottom{height:34px;display:flex;align-items:flex-end;justify-content:space-between;font-family:'SF Mono','Cascadia Mono',ui-monospace,monospace;font-size:15px;font-weight:600;letter-spacing:.05em;color:var(--muted)}
  .issue{color:var(--fg)}
  .item-label{font-size:21px;font-weight:750;line-height:1.25;word-break:keep-all}.item-detail{margin-top:8px;font-size:15px;line-height:1.35;color:var(--muted);word-break:keep-all}.item-value{display:block;margin-bottom:8px;font-size:34px;line-height:1;font-weight:800;color:var(--accent);letter-spacing:-.03em}
  .flow{width:100%;display:flex;align-items:stretch;gap:10px}.flow .node{flex:1;min-width:0;padding:22px 12px;border:1px solid var(--line);display:flex;flex-direction:column;justify-content:center;text-align:center}.flow .arrow{display:flex;align-items:center;color:var(--accent);font-size:24px;font-weight:700}
  .compare{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:14px}.compare .node{min-height:210px;padding:28px 22px;border:1px solid var(--line);display:flex;flex-direction:column;justify-content:flex-end}.compare .node:last-child{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 9%,transparent)}.compare .node::before{content:attr(data-index);margin-bottom:auto;font-family:'SF Mono','Cascadia Mono',ui-monospace,monospace;color:var(--muted);font-size:13px;letter-spacing:.12em}
  .loop{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:12px;position:relative}.loop::after{content:'↻';position:absolute;inset:50% auto auto 50%;transform:translate(-50%,-50%);width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:var(--bg);border:1px solid var(--accent);color:var(--accent);font-size:29px}.loop .node{min-height:92px;border:1px solid var(--line);display:grid;place-items:center;text-align:center;padding:14px}
  .stack{width:100%;display:flex;flex-direction:column-reverse;gap:10px;align-items:center}.stack .node{height:56px;border:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 20px}.stack .node:nth-child(1){width:100%;border-color:var(--accent)}.stack .node:nth-child(2){width:88%}.stack .node:nth-child(3){width:76%}.stack .node:nth-child(4){width:64%}
  .timeline{width:100%;display:flex;align-items:flex-start;position:relative;padding-top:24px}.timeline::before{content:"";position:absolute;left:5%;right:5%;top:39px;height:2px;background:var(--line)}.timeline .node{flex:1;position:relative;text-align:center;padding:46px 8px 0}.timeline .node::before{content:"";position:absolute;top:7px;left:50%;width:16px;height:16px;border-radius:50%;transform:translateX(-50%);background:var(--bg);border:3px solid var(--accent)}
  .ratio{width:100%;display:flex;flex-direction:column;gap:18px}.ratio .node{position:relative;border:1px solid var(--line);padding:20px 22px;overflow:hidden}.ratio .node::before{content:"";position:absolute;inset:0 auto 0 0;width:var(--fill);background:color-mix(in srgb,var(--accent) 16%,transparent)}.ratio .node>*{position:relative}.ratio .node:first-child{--fill:28%}.ratio .node:last-child{--fill:82%}.ratio .item-label{display:flex;align-items:flex-end;justify-content:space-between;gap:16px}.ratio .item-value{margin:0;font-size:31px}
  .matrix{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:10px}.matrix .node{min-height:108px;padding:18px;border:1px solid var(--line);display:flex;align-items:flex-end}.matrix .node:nth-child(2),.matrix .node:nth-child(3){border-color:color-mix(in srgb,var(--accent) 55%,transparent)}
  .signal{width:100%;display:flex;flex-direction:column;gap:11px}.signal .node{height:52px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px}.signal .node::before{content:"";width:var(--signal);height:8px;background:var(--accent)}.signal .node:nth-child(1){--signal:36px}.signal .node:nth-child(2){--signal:70px}.signal .node:nth-child(3){--signal:104px}.signal .node:nth-child(4){--signal:138px}
  .branch{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:12px}.branch .node{min-height:82px;border:1px solid var(--line);padding:18px;display:flex;flex-direction:column;justify-content:center}.branch .node:first-child{grid-column:1/-1;border-color:var(--accent)}.branch .node:nth-child(n+4){background:color-mix(in srgb,var(--accent) 8%,transparent)}
</style>
</head>
<body>
  <div class="guides"></div>
  <div class="frame">
    <div class="top">
      <div class="brand"><img class="mark" src="../../logo/ap-mark.png" alt=""><img class="wordmark" id="wordmark" src="../../logo/ap-wordmark-web.png" alt="Ahn Partners"></div>
      <div class="category" id="category"></div>
    </div>
    <div class="content">
      <div class="copy"><h1 class="title" id="title"></h1><p class="thesis" id="thesis"></p></div>
      <div class="visual" id="visual" role="img"></div>
    </div>
    <div class="bottom"><span>ahn-partners.net/insights</span><span class="issue" id="issue"></span></div>
  </div>
<script>
  const params = new URLSearchParams(location.search);
  const data = JSON.parse(params.get('data') || '{}');
  const theme = data.composition === 'reverse' ? 'light' : data.composition === 'vertical' ? 'deep' : 'dark';
  document.body.classList.add(`theme-${theme}`, `composition-${data.composition || 'split'}`, `accent-${data.accent || 'teal'}`);
  if (theme === 'light') document.getElementById('wordmark').src = '../../logo/ap-wordmark-dark.png';
  document.getElementById('category').textContent = data.category || 'INSIGHT';
  document.getElementById('title').textContent = data.title || '';
  document.getElementById('thesis').textContent = data.thesis || '';
  document.getElementById('issue').textContent = data.slug || '';
  const visual = document.getElementById('visual');
  visual.dataset.layout = data.layout || 'flow';
  visual.setAttribute('aria-label', `${data.title}: ${data.thesis}`);

  const node = (item, index) => `<div class="node" data-index="0${index + 1}"><div class="item-label">${item.value ? `<span class="item-value">${item.value}</span>` : ''}${item.label || ''}</div>${item.detail ? `<div class="item-detail">${item.detail}</div>` : ''}</div>`;
  const items = data.items || [];
  if (data.layout === 'flow') visual.innerHTML = `<div class="flow">${items.map((item,index) => `${node(item,index)}${index < items.length - 1 ? '<div class="arrow">→</div>' : ''}`).join('')}</div>`;
  else if (data.layout === 'compare') visual.innerHTML = `<div class="compare">${items.map(node).join('')}</div>`;
  else if (data.layout === 'loop') visual.innerHTML = `<div class="loop">${items.map(node).join('')}</div>`;
  else if (data.layout === 'stack') visual.innerHTML = `<div class="stack">${items.map(node).join('')}</div>`;
  else if (data.layout === 'timeline') visual.innerHTML = `<div class="timeline">${items.map(node).join('')}</div>`;
  else if (data.layout === 'ratio') visual.innerHTML = `<div class="ratio">${items.map(node).join('')}</div>`;
  else if (data.layout === 'matrix') visual.innerHTML = `<div class="matrix">${items.map(node).join('')}</div>`;
  else if (data.layout === 'signal') visual.innerHTML = `<div class="signal">${items.map(node).join('')}</div>`;
  else visual.innerHTML = `<div class="branch">${items.map(node).join('')}</div>`;
</script>
</body>
</html>
